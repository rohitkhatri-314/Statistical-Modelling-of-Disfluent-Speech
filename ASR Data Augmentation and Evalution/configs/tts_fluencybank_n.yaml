input_manifest: data/processed/fluencybank_manifest.jsonl
output_manifest: data/augmented/manifests/fluencybank_n_manifest.jsonl
audio_dir: data/augmented/audio

# TTS settings to generate the clean synthetic FluencyBank-N
provider: xtts
xtts_model: tts_models/multilingual/multi-dataset/xtts_v2
device: auto

# The paper mentions using 10 speaker vectors to generate FluencyBank-N
num_speakers: 10
speaker_embeddings_dataset: Matthijs/cmu-arctic-xvectors
speaker_embeddings_split: validation
sample_rate: 16000

max_text_chars: 250
overwrite: false
